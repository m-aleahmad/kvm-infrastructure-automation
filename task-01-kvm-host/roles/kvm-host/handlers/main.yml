---
- name: Reload SSH service
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Apply kernel parameters
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: true

- name: Reload nftables service
  ansible.builtin.service:
    name: nftables
    state: reloaded

- name: Restart systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted